[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "peugeot80"
version = "0.1.0"
description = "Stop charging a Peugeot e-2008 (2022) at ~80% by controlling a Mennekes wallbox"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
    "pymodbus>=3.5",
]

[project.optional-dependencies]
obd = ["obd>=0.7.1"]

[project.scripts]
peugeot80 = "peugeot80.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
